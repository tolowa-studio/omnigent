name: ci

# Minimal pull-request and main-branch validation so merge guards (e.g.
# tolowa-review) can require a green `ci` check without running the full
# pytest matrix. The full unit-test matrix lives in pytest-matrix.yml
# (`name: CI`) for when the org re-enables the heavy Actions suite.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Check uv.lock uses the public PyPI index
        run: python scripts/normalize_uv_lock_registry.py --check uv.lock

      - name: Version lockstep check
        run: |
          python -m pip install --quiet --disable-pip-version-check packaging
          python scripts/update_versions.py check

      - name: Validate workflow YAML parses
        run: |
          python -m pip install --quiet pyyaml
          python <<'PY'
          from pathlib import Path

          import yaml

          root = Path(".github/workflows")
          for path in sorted(root.glob("*.yml")):
              with path.open(encoding="utf-8") as fh:
                  yaml.safe_load(fh)
          print(f"Parsed {len(list(root.glob('*.yml')))} workflow files.")
          PY
